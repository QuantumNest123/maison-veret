<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2e"/>
            <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
        <pattern id="weaveM" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#f4efe7" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <radialGradient id="vigM" cx="50%" cy="50%" r="80%">
            <stop offset="40%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
        </radialGradient>
    </defs>

    <rect width="600" height="800" fill="url(#bgM)"/>
    <rect width="600" height="800" fill="url(#weaveM)"/>
    <rect width="600" height="800" fill="url(#vigM)"/>

    <!-- Curling measuring tape -->
    <g stroke="#c9a878" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Tape top edge (bolder) -->
        <path d="M 50 260 Q 200 180, 360 240 T 540 370 Q 595 450, 480 530 T 220 590 Q 130 610, 50 680" stroke-width="2"/>
        <!-- Tape bottom edge -->
        <path d="M 50 298 Q 200 218, 360 278 T 540 408 Q 595 488, 480 568 T 220 628 Q 130 648, 50 718" stroke-width="1.3" opacity="0.75"/>

        <!-- Major tick marks -->
        <g stroke-width="1.4" opacity="0.9">
            <line x1="90" y1="240" x2="90" y2="258"/>
            <line x1="130" y1="225" x2="130" y2="243"/>
            <line x1="170" y1="213" x2="170" y2="231"/>
            <line x1="210" y1="208" x2="210" y2="226"/>
            <line x1="250" y1="208" x2="250" y2="226"/>
            <line x1="290" y1="215" x2="290" y2="233"/>
            <line x1="330" y1="227" x2="330" y2="245"/>
            <line x1="370" y1="242" x2="370" y2="260"/>
            <line x1="410" y1="260" x2="410" y2="278"/>
            <line x1="450" y1="282" x2="450" y2="300"/>
            <line x1="490" y1="306" x2="490" y2="326"/>
            <line x1="525" y1="335" x2="525" y2="355"/>
        </g>

        <!-- Minor tick marks between majors -->
        <g stroke-width="0.8" opacity="0.6">
            <line x1="110" y1="232" x2="110" y2="244"/>
            <line x1="150" y1="218" x2="150" y2="230"/>
            <line x1="190" y1="210" x2="190" y2="222"/>
            <line x1="230" y1="207" x2="230" y2="219"/>
            <line x1="270" y1="210" x2="270" y2="222"/>
            <line x1="310" y1="220" x2="310" y2="232"/>
            <line x1="350" y1="234" x2="350" y2="246"/>
            <line x1="390" y1="250" x2="390" y2="262"/>
            <line x1="430" y1="270" x2="430" y2="282"/>
            <line x1="470" y1="293" x2="470" y2="305"/>
        </g>

        <!-- Numbers along the tape -->
        <g fill="#c9a878" stroke="none" opacity="0.78" font-family="Georgia, serif" font-size="13" font-style="italic">
            <text x="125" y="206">10</text>
            <text x="245" y="195">20</text>
            <text x="365" y="225">30</text>
        </g>
    </g>

    <!-- Chalk mark (X) on fabric, lower left -->
    <g stroke="#f4efe7" stroke-width="2" opacity="0.65" stroke-linecap="round">
        <line x1="95" y1="485" x2="148" y2="540"/>
        <line x1="148" y1="485" x2="95" y2="540"/>
    </g>
    <!-- Chalk dots -->
    <g fill="#f4efe7" opacity="0.55">
        <circle cx="180" cy="500" r="2.2"/>
        <circle cx="186" cy="518" r="1.7"/>
        <circle cx="172" cy="532" r="2"/>
    </g>
    <!-- Small chalk reference number -->
    <text x="100" y="568" fill="#f4efe7" opacity="0.55" font-family="Georgia, serif" font-style="italic" font-size="14">5⁄8″</text>

    <!-- Scissors silhouette, lower right -->
    <g stroke="#c9a878" stroke-width="1.6" fill="none" opacity="0.7" stroke-linecap="round">
        <ellipse cx="445" cy="675" rx="17" ry="23"/>
        <ellipse cx="498" cy="675" rx="17" ry="23"/>
        <line x1="434" y1="660" x2="512" y2="722"/>
        <line x1="508" y1="660" x2="430" y2="722"/>
        <circle cx="471" cy="690" r="2.6" fill="#c9a878"/>
    </g>

    <!-- Corner Roman numeral -->
    <text x="545" y="140" fill="#c9a878" opacity="0.5" font-family="Georgia, serif" font-style="italic" font-size="64" text-anchor="end">II</text>

    <!-- Sub-notation -->
    <text x="545" y="166" fill="#c9a878" opacity="0.65" font-family="Georgia, serif" font-size="12" font-style="italic" text-anchor="end" letter-spacing="2">32 · pts</text>

    <!-- Editorial label -->
    <text x="70" y="730" fill="#f4efe7" opacity="0.65" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" font-weight="500">MEASURED · BY · HAND</text>

    <!-- Corner crop marks -->
    <g stroke="#c9a878" stroke-width="1.1" opacity="0.75">
        <line x1="50" y1="50" x2="50" y2="82"/>
        <line x1="50" y1="50" x2="82" y2="50"/>
        <line x1="550" y1="750" x2="550" y2="718"/>
        <line x1="550" y1="750" x2="518" y2="750"/>
    </g>
</svg>
