<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2e"/>
            <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
        <pattern id="weaveL" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#f4efe7" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
        <radialGradient id="vigL" cx="50%" cy="50%" r="80%">
            <stop offset="40%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
        </radialGradient>
    </defs>

    <rect width="600" height="800" fill="url(#bgL)"/>
    <rect width="600" height="800" fill="url(#weaveL)"/>
    <rect width="600" height="800" fill="url(#vigL)"/>

    <!-- Lapel illustration: bigger and more detailed -->
    <g stroke="#c9a878" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Shoulder line, extended -->
        <path d="M 70 100 L 340 130" stroke-width="1.5" opacity="0.75"/>

        <!-- Outer lapel edge (bigger) -->
        <path d="M 340 130 L 380 280 L 490 250 L 525 320 L 425 365 L 365 345 L 320 540 L 360 770" stroke-width="2"/>

        <!-- Notch + small dot at corner -->
        <path d="M 380 280 L 450 285" stroke-width="1.7" opacity="0.8"/>
        <circle cx="455" cy="285" r="2.4" fill="#c9a878" opacity="0.75"/>

        <!-- Break/roll line (dashed) -->
        <path d="M 340 130 L 385 325" stroke-width="1.1" stroke-dasharray="2 7" opacity="0.7"/>

        <!-- Hand stitching · primary dotted line -->
        <path d="M 348 220 L 375 365 L 350 540 L 372 750" stroke-width="1.8" stroke-dasharray="1 7" opacity="0.95"/>

        <!-- Hand stitching · secondary inner canvas indication -->
        <path d="M 320 250 L 350 380 L 330 535 L 350 730" stroke-width="0.9" stroke-dasharray="1 9" opacity="0.5"/>

        <!-- Buttonhole -->
        <line x1="312" y1="465" x2="362" y2="467" stroke-width="2.2"/>
        <circle cx="312" cy="465" r="3.6" fill="#c9a878"/>
        <circle cx="338" cy="466" r="14" stroke-width="0.7" stroke-dasharray="1 4" opacity="0.6"/>

        <!-- Bottom hem · double stitch -->
        <path d="M 360 770 L 110 770" stroke-width="1.3" opacity="0.6"/>
        <path d="M 360 780 L 110 780" stroke-width="0.5" stroke-dasharray="1 6" opacity="0.55"/>

        <!-- Tailor's reference marks (+ and × across the canvas) -->
        <g opacity="0.6" stroke-width="1">
            <line x1="120" y1="240" x2="132" y2="240"/>
            <line x1="126" y1="234" x2="126" y2="246"/>

            <line x1="490" y1="450" x2="502" y2="462"/>
            <line x1="502" y1="450" x2="490" y2="462"/>

            <line x1="150" y1="580" x2="162" y2="580"/>
            <line x1="156" y1="574" x2="156" y2="586"/>

            <line x1="465" y1="610" x2="475" y2="620"/>
            <line x1="475" y1="610" x2="465" y2="620"/>
        </g>

        <!-- Bottom measurement ruler segment -->
        <g opacity="0.6">
            <line x1="70" y1="690" x2="220" y2="690" stroke-width="0.9"/>
            <line x1="70" y1="683" x2="70" y2="697" stroke-width="0.9"/>
            <line x1="95" y1="686" x2="95" y2="694" stroke-width="0.6"/>
            <line x1="120" y1="686" x2="120" y2="694" stroke-width="0.6"/>
            <line x1="145" y1="683" x2="145" y2="697" stroke-width="0.9"/>
            <line x1="170" y1="686" x2="170" y2="694" stroke-width="0.6"/>
            <line x1="195" y1="686" x2="195" y2="694" stroke-width="0.6"/>
            <line x1="220" y1="683" x2="220" y2="697" stroke-width="0.9"/>
        </g>

        <!-- Small chalk dot accent -->
        <circle cx="430" cy="540" r="2.2" fill="#f4efe7" opacity="0.55"/>
        <circle cx="445" cy="555" r="1.5" fill="#f4efe7" opacity="0.45"/>
    </g>

    <!-- Corner Roman numeral -->
    <text x="545" y="140" fill="#c9a878" opacity="0.5" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="64" text-anchor="end">I</text>

    <!-- Size notation under numeral -->
    <text x="545" y="166" fill="#c9a878" opacity="0.65" font-family="Georgia, serif" font-size="12" font-style="italic" text-anchor="end" letter-spacing="2">L · 42</text>

    <!-- Editorial label, bottom -->
    <text x="70" y="730" fill="#f4efe7" opacity="0.65" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" font-weight="500">HAND · STITCHED · LAPEL</text>

    <!-- Corner crop marks -->
    <g stroke="#c9a878" stroke-width="1.1" opacity="0.75">
        <line x1="50" y1="50" x2="50" y2="82"/>
        <line x1="50" y1="50" x2="82" y2="50"/>
        <line x1="550" y1="750" x2="550" y2="718"/>
        <line x1="550" y1="750" x2="518" y2="750"/>
    </g>
</svg>
