<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2e"/>
            <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
        <radialGradient id="vigS" cx="50%" cy="50%" r="80%">
            <stop offset="40%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
        </radialGradient>

        <!-- Windowpane (back) -->
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <rect width="32" height="32" fill="#0d0d0e"/>
            <line x1="0" y1="0" x2="32" y2="0" stroke="#c9a878" stroke-width="0.7" opacity="0.62"/>
            <line x1="0" y1="0" x2="0" y2="32" stroke="#c9a878" stroke-width="0.7" opacity="0.62"/>
        </pattern>

        <!-- Herringbone (middle) -->
        <pattern id="herring" width="22" height="22" patternUnits="userSpaceOnUse">
            <rect width="22" height="22" fill="#26262a"/>
            <path d="M 0 6 L 11 0 L 11 6 L 0 12 Z" fill="#c9a878" opacity="0.36"/>
            <path d="M 11 17 L 22 11 L 22 17 L 11 22 Z" fill="#c9a878" opacity="0.36"/>
        </pattern>

        <!-- Pinstripe (front) -->
        <pattern id="pin" width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="#1a1a1c"/>
            <line x1="3" y1="0" x2="3" y2="14" stroke="#c9a878" stroke-width="0.7" opacity="0.82"/>
        </pattern>
    </defs>

    <rect width="800" height="500" fill="url(#bgS)"/>
    <rect width="800" height="500" fill="url(#vigS)"/>

    <!-- Back swatch: windowpane, upper-left -->
    <g transform="rotate(-8 220 220)">
        <rect x="100" y="140" width="220" height="190" fill="url(#grid)" stroke="#c9a878" stroke-width="1.4" stroke-opacity="0.85"/>
        <path d="M 300 140 L 320 160 L 300 160 Z" fill="#1a1a1c" stroke="#c9a878" stroke-width="0.8" stroke-opacity="0.7"/>
    </g>

    <!-- Middle swatch: herringbone -->
    <g transform="rotate(5 380 250)">
        <rect x="270" y="170" width="240" height="190" fill="url(#herring)" stroke="#c9a878" stroke-width="1.5" stroke-opacity="0.9"/>
        <rect x="278" y="178" width="224" height="174" fill="none" stroke="#c9a878" stroke-width="0.6" stroke-opacity="0.55" stroke-dasharray="2 4"/>
    </g>

    <!-- Front swatch: pinstripe with tag -->
    <g transform="rotate(-3 540 280)">
        <rect x="440" y="190" width="245" height="200" fill="url(#pin)" stroke="#c9a878" stroke-width="1.6" stroke-opacity="1"/>
        <!-- Top edge stitch line -->
        <line x1="440" y1="200" x2="685" y2="200" stroke="#c9a878" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.7"/>

        <!-- Hanging tag -->
        <line x1="600" y1="390" x2="600" y2="418" stroke="#c9a878" stroke-width="1.2" opacity="0.95"/>
        <rect x="552" y="418" width="96" height="40" fill="#1a1a1c" stroke="#c9a878" stroke-width="1.1" stroke-opacity="0.95"/>
        <circle cx="600" cy="426" r="3" fill="#c9a878"/>
        <text x="600" y="445" fill="#c9a878" font-family="Georgia, serif" font-size="12" text-anchor="middle" letter-spacing="1.5" font-style="italic">SUPER 130s</text>
    </g>

    <!-- Corner Roman numeral -->
    <text x="755" y="100" fill="#c9a878" opacity="0.5" font-family="Georgia, serif" font-style="italic" font-size="54" text-anchor="end">III</text>
    <text x="755" y="124" fill="#c9a878" opacity="0.7" font-family="Georgia, serif" font-size="11" font-style="italic" text-anchor="end" letter-spacing="2">wool</text>

    <!-- Editorial label -->
    <text x="60" y="80" fill="#f4efe7" opacity="0.7" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" font-weight="500">WOOL · SWATCHES · ITALY</text>

    <!-- Corner crop marks -->
    <g stroke="#c9a878" stroke-width="1.2" opacity="0.8">
        <line x1="40" y1="40" x2="40" y2="70"/>
        <line x1="40" y1="40" x2="70" y2="40"/>
        <line x1="760" y1="460" x2="760" y2="430"/>
        <line x1="760" y1="460" x2="730" y2="460"/>
    </g>
</svg>
